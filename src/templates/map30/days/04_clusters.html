{% extends parent_template %}
{% load static %}

{% block day_body %}
<div class="map30-wrap"><div id="map" class="map30-canvas"></div></div>
{% endblock %}

{% block day_js %}
<script src="{% static 'map30/js/map-core.js' %}"></script>
<script>
(function () {
    "use strict";
    const map = Map30.createMap("map", { basemap: "voyager", center: [-1.9868, 43.3238], zoom: 15.5 });

    map.on("load", function () {
        map.addSource("pintxos", {
            type:"geojson",
            data: "{% url 'map30:day04_pintxos_geojson' %}",
            cluster: true,
            clusterMaxZoom: 17,
            clusterRadius: 40
        });

        map.addLayer({
            id:"pintxo-clusters", type:"circle", source:"pintxos", filter:["has","point_count"],
            paint:{
                "circle-color":[
                    "step", ["get","point_count"],
                    "#60a5fa", 5, "#f59e0b", 15, "#ef4444"
                ],
                "circle-radius":[
                    "step", ["get","point_count"],
                    18, 5, 24, 15, 32
                ],
                "circle-stroke-color":"#ffffff", "circle-stroke-width":2
            }
        });
        map.addLayer({
            id:"pintxo-count", type:"symbol", source:"pintxos", filter:["has","point_count"],
            layout:{ "text-field":["get","point_count_abbreviated"], "text-size":13, "text-font":["Open Sans Bold","Arial Unicode MS Bold"] },
            paint:{ "text-color":"#ffffff" }
        });
        map.addLayer({
            id:"pintxo-point", type:"circle", source:"pintxos", filter:["!",["has","point_count"]],
            paint:{ "circle-color":"#dc2626", "circle-radius":6, "circle-stroke-color":"#ffffff", "circle-stroke-width":1.5 }
        });

        map.on("click", "pintxo-point", function(e){
            new maplibregl.Popup().setLngLat(e.lngLat)
                .setHTML(`<strong>${e.features[0].properties.name}</strong>`).addTo(map);
        });
        map.on("click", "pintxo-clusters", function(e){
            const cid = e.features[0].properties.cluster_id;
            map.getSource("pintxos").getClusterExpansionZoom(cid).then(z => {
                map.easeTo({ center:e.features[0].geometry.coordinates, zoom: z });
            });
        });
    });

    Map30.addLegend(document.querySelector(".map30-wrap"), `
        <h4>Nº de pintxos</h4>
        <div class="row"><span class="swatch" style="background:#60a5fa"></span><span>&lt; 5</span></div>
        <div class="row"><span class="swatch" style="background:#f59e0b"></span><span>5–15</span></div>
        <div class="row"><span class="swatch" style="background:#ef4444"></span><span>&gt; 15</span></div>
        <div class="row" style="color:#94a3b8;margin-top:6px;font-size:10px">Muestra curada de la Parte Vieja.</div>
    `);
})();
</script>
{% endblock %}
