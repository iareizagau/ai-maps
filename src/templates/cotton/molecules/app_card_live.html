{% load i18n %}
{# Card grande para app `live`: icono + nombre + tagline + arrow. Hover: -translate-y + glow. #}
<c-vars name="" tagline="" icon="map-pin" url="#" accent_color="#f97316" />

<a href="{{ url }}"
   aria-label="{% trans 'Abrir' %} {{ name }}"
   class="group relative overflow-hidden glass rounded-3xl p-5 sm:p-6 border border-slate-200/50 dark:border-white/5 hover:border-[var(--accent)]/40 hover:-translate-y-1 hover:shadow-2xl transition-all duration-500 block"
   style="--accent: {{ accent_color }};">

    <div class="absolute -right-10 -top-10 w-32 h-32 rounded-full blur-3xl opacity-10 group-hover:opacity-30 transition-opacity duration-500"
         style="background-color: var(--accent);" aria-hidden="true"></div>

    <div class="relative z-10 flex flex-col h-full">
        <div class="flex items-center justify-between mb-4">
            <span class="w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-110 group-hover:-rotate-3 transition-transform duration-300"
                  style="background-color: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent);">
                <i data-lucide="{{ icon }}" class="w-5 h-5"></i>
            </span>
            <span class="w-7 h-7 rounded-full flex items-center justify-center bg-slate-100 dark:bg-white/5 group-hover:bg-[var(--accent)] transition-colors duration-300">
                <i data-lucide="arrow-up-right" class="w-3.5 h-3.5 text-slate-400 group-hover:text-white transition-colors"></i>
            </span>
        </div>

        <h3 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-snug">
            {{ name }}
        </h3>

        {% if tagline %}
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1.5 leading-relaxed line-clamp-2">
            {{ tagline }}
        </p>
        {% endif %}
    </div>
</a>
