services:
  db:
    container_name: ${COMPOSE_PROJECT_NAME:-maps}_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maps_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}

  redis:
    container_name: ${COMPOSE_PROJECT_NAME:-maps}_redis_prod
    restart: unless-stopped

  web_estrata:
    container_name: ${COMPOSE_PROJECT_NAME:-maps}_web_estrata_prod
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -
    ports:
      - "127.0.0.1:8060:8000"
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      ENV: estrata

  web_maps:
    container_name: ${COMPOSE_PROJECT_NAME:-maps}_web_maps_prod
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -
    ports:
      - "127.0.0.1:9060:8000"
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      ENV: maps

  worker:
    container_name: ${COMPOSE_PROJECT_NAME:-maps}_worker_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

  beat:
    container_name: ${COMPOSE_PROJECT_NAME:-maps}_beat_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
