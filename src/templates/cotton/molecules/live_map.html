{% load i18n %}
{# Live map hero: shows pulse_items as colored markers on a clean CartoDB basemap. #}
{# Centered on Euskal Herria (~43.0, -2.5). Carga diferida via Alpine init. #}
<c-vars points_json="[]" height="h-[360px] sm:h-[480px]" />

<div class="relative rounded-2xl sm:rounded-3xl overflow-hidden border border-slate-200 dark:border-white/10 shadow-xl sm:shadow-2xl {{ height }}"
     x-data="liveMap({{ points_json }})"
     x-init="init()">

    <div id="home-live-map" class="w-full h-full z-0 bg-slate-100 dark:bg-slate-900"></div>

    <!-- En vivo badge -->
    <div class="absolute top-3 left-3 sm:top-4 sm:left-4 z-10 pointer-events-none">
        <div class="glass px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full border border-white/20 flex items-center gap-1.5 sm:gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-[10px] sm:text-[11px] font-black uppercase tracking-widest text-slate-700 dark:text-emerald-400">
                {% trans "En vivo" %}
            </span>
        </div>
    </div>

    <!-- Scroll Safe Lock Overlay (Mobile only) -->
    <div x-show="isLocked" 
         @click="unlock()"
         class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-slate-950/20 dark:bg-slate-950/40 backdrop-blur-[1px] cursor-pointer sm:hidden text-center p-4 transition-all duration-300"
         x-cloak>
        <div class="glass px-4 py-2.5 rounded-full border border-white/20 flex items-center gap-2 text-slate-800 dark:text-white shadow-lg active:scale-95 transition-all">
            <i data-lucide="map" class="w-4 h-4 text-primary"></i>
            <span class="text-[10px] font-black uppercase tracking-widest">{% trans "Toca para explorar el mapa" %}</span>
        </div>
    </div>

    <!-- Layer Filter Toggles (Bottom Center) -->
    <div class="absolute bottom-4 left-4 right-4 z-20 flex gap-2 overflow-x-auto pb-1.5 scrollbar-none justify-start sm:justify-center pointer-events-auto" 
         x-show="!selectedPoint || !L.Browser.mobile"
         x-cloak>
        <!-- Todas -->
        <button @click="setFilter('all')" 
                :class="activeFilter === 'all' ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 border-transparent shadow-lg scale-105' : 'bg-white/95 text-slate-700 dark:bg-slate-800/95 dark:text-slate-200 border-slate-200/50 dark:border-slate-700/50'"
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] sm:text-xs font-bold border backdrop-blur-md transition-all hover:scale-105 active:scale-95 whitespace-nowrap">
            <span>🌈</span>
            <span>{% trans "Todas" %}</span>
        </button>
        <!-- Kultur -->
        <button @click="setFilter('kultur')" 
                :class="activeFilter === 'kultur' ? 'bg-rose-500 text-white border-transparent shadow-lg scale-105' : 'bg-white/95 text-slate-700 dark:bg-slate-800/95 dark:text-slate-200 border-slate-200/50 dark:border-slate-700/50'"
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] sm:text-xs font-bold border backdrop-blur-md transition-all hover:scale-105 active:scale-95 whitespace-nowrap">
            <span>🎭</span>
            <span>{% trans "Kultur" %}</span>
        </button>
        <!-- Pintxos -->
        <button @click="setFilter('pintxos')" 
                :class="activeFilter === 'pintxos' ? 'bg-orange-500 text-white border-transparent shadow-lg scale-105' : 'bg-white/95 text-slate-700 dark:bg-slate-800/95 dark:text-slate-200 border-slate-200/50 dark:border-slate-700/50'"
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] sm:text-xs font-bold border backdrop-blur-md transition-all hover:scale-105 active:scale-95 whitespace-nowrap">
            <span>🍢</span>
            <span>{% trans "Pintxos" %}</span>
        </button>
        <!-- SBK -->
        <button @click="setFilter('sbk')" 
                :class="activeFilter === 'sbk' ? 'bg-emerald-500 text-white border-transparent shadow-lg scale-105' : 'bg-white/95 text-slate-700 dark:bg-slate-800/95 dark:text-slate-200 border-slate-200/50 dark:border-slate-700/50'"
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] sm:text-xs font-bold border backdrop-blur-md transition-all hover:scale-105 active:scale-95 whitespace-nowrap">
            <span>💃</span>
            <span>{% trans "SBK" %}</span>
        </button>
        <!-- Inguru -->
        <button @click="setFilter('inguru')" 
                :class="activeFilter === 'inguru' ? 'bg-cyan-500 text-white border-transparent shadow-lg scale-105' : 'bg-white/95 text-slate-700 dark:bg-slate-800/95 dark:text-slate-200 border-slate-200/50 dark:border-slate-700/50'"
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] sm:text-xs font-bold border backdrop-blur-md transition-all hover:scale-105 active:scale-95 whitespace-nowrap">
            <span>🍃</span>
            <span>{% trans "Aire" %}</span>
        </button>
        <!-- ZBE -->
        <button @click="setFilter('zbe')" 
                :class="activeFilter === 'zbe' ? 'bg-rose-600 text-white border-transparent shadow-lg scale-105' : 'bg-white/95 text-slate-700 dark:bg-slate-800/95 dark:text-slate-200 border-slate-200/50 dark:border-slate-700/50'"
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] sm:text-xs font-bold border backdrop-blur-md transition-all hover:scale-105 active:scale-95 whitespace-nowrap">
            <span>🚫</span>
            <span>{% trans "ZBE" %}</span>
        </button>
    </div>

    <!-- Bottom Sheet Details (Mobile only) -->
    <div x-show="selectedPoint && !isLocked"
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="translate-y-full"
         x-transition:enter-end="translate-y-0"
         x-transition:leave="transition ease-in duration-200 transform"
         x-transition:leave-start="translate-y-0"
         x-transition:leave-end="translate-y-full"
         class="absolute bottom-0 left-0 right-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-lg border-t border-slate-200 dark:border-white/10 rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.15)] px-5 pt-4 pb-6 sm:hidden text-left"
         x-cloak>
        
        <!-- Handle bar -->
        <div class="flex justify-center mb-4">
            <div class="w-10 h-1 bg-slate-200 dark:bg-white/15 rounded-full cursor-pointer" @click="selectedPoint = null"></div>
        </div>

        <!-- Close button -->
        <button @click="selectedPoint = null" class="absolute top-4 right-4 p-1 rounded-full hover:bg-slate-100 dark:hover:bg-white/5 text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors" aria-label="{% trans 'Cerrar' %}">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
        
        <template x-if="selectedPoint">
            <div>
                <div class="flex items-center gap-2 mb-2">
                    <span class="w-6.5 h-6.5 rounded-lg flex items-center justify-center shrink-0"
                          :style="`background-color: ${selectedPoint.accent}20; color: ${selectedPoint.accent};`">
                        <i :data-lucide="selectedPoint.icon || 'map-pin'" class="w-3.5 h-3.5"></i>
                    </span>
                    <span class="text-[10px] font-black uppercase tracking-widest text-slate-500 dark:text-slate-400" x-text="selectedPoint.app_name"></span>
                </div>
                <h4 class="text-sm font-bold text-slate-900 dark:text-white leading-snug" x-text="selectedPoint.headline"></h4>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 leading-relaxed" x-text="selectedPoint.subline"></p>
                
                <a :href="selectedPoint.url" class="inline-flex items-center justify-center w-full py-3 mt-4 rounded-xl text-xs font-bold text-white transition-all text-center shadow-md active:scale-98 animate-pulse-subtle"
                   :style="`background-color: ${selectedPoint.accent};`">
                    {% trans "Ver detalle" %}
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5 ml-1"></i>
                </a>
            </div>
        </template>
    </div>

    <!-- Sin datos: fallback overlay -->
    <template x-if="!points || points.length === 0">
        <div class="absolute inset-0 z-10 flex items-center justify-center pointer-events-none">
            <div class="glass px-6 py-4 rounded-2xl text-center max-w-xs">
                <p class="text-xs text-slate-500 dark:text-slate-400">
                    {% trans "Cargando lo que pasa hoy en Euskal Herria…" %}
                </p>
            </div>
        </div>
    </template>

    <style>
        .leaflet-container { font-family: inherit; background: #f8fafc; }
        .dark .leaflet-container { background: #0f172a; }
        
        .pulse-popup .leaflet-popup-content-wrapper {
            background: rgba(255,255,255,0.95) !important;
            backdrop-filter: blur(12px);
            border-radius: 16px !important;
            border: 1px solid rgba(0,0,0,0.05);
            padding: 4px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1) !important;
        }
        .dark .pulse-popup .leaflet-popup-content-wrapper {
            background: rgba(30,41,59,0.95) !important;
            color: white !important;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .pulse-popup .leaflet-popup-tip {
            background: rgba(255,255,255,0.95) !important;
        }
        .dark .pulse-popup .leaflet-popup-tip {
            background: rgba(30,41,59,0.95) !important;
        }
        
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.92; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s infinite ease-in-out;
        }
    </style>
</div>

<script>
function liveMap(initialPoints) {
    return {
        map: null,
        points: initialPoints,
        initialized: false,
        isLocked: true,
        selectedPoint: null,
        activeFilter: 'all',
        markerGroup: null,

        init() {
            // Esperar a Leaflet (cargado en extra_head de home.html)
            this.waitForLeaflet(() => this.$nextTick(() => this.buildMap()));
        },

        waitForLeaflet(cb, attempts = 0) {
            if (window.L) return cb();
            if (attempts > 50) return; // ~5s, render-fallback
            setTimeout(() => this.waitForLeaflet(cb, attempts + 1), 100);
        },

        buildMap() {
            if (this.initialized) return;
            this.initialized = true;

            const isMobile = L.Browser.mobile;
            this.isLocked = isMobile;

            this.map = L.map('home-live-map', {
                scrollWheelZoom: true,
                zoomControl: false,
                attributionControl: false,
                dragging: !isMobile,
                tap: !isMobile,
                touchZoom: true,
                doubleClickZoom: true,
            }).setView([43.05, -2.4], 8);

            // Add standard Leaflet zoom buttons in the top-right corner to avoid overlaps
            L.control.zoom({ position: 'topright' }).addTo(this.map);

            // CartoDB Voyager — limpio, sin API key, gratis para uso razonable
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                subdomains: 'abcd',
                maxZoom: 19,
            }).addTo(this.map);

            L.control.attribution({ position: 'bottomleft', prefix: false })
                .addAttribution('© <a href="https://www.openstreetmap.org/copyright">OSM</a> · <a href="https://carto.com/attributions">CARTO</a>')
                .addTo(this.map);

            // Initialize markerGroup
            this.markerGroup = L.featureGroup().addTo(this.map);

            this.renderMarkers();

            // Cerrar bottom sheet al pulsar fuera del marcador
            this.map.on('click', () => {
                this.selectedPoint = null;
            });

            setTimeout(() => this.map.invalidateSize(), 300);
        },

        unlock() {
            this.isLocked = false;
            if (this.map) {
                this.map.dragging.enable();
                if (this.map.tap) this.map.tap.enable();
                if (this.map.touchZoom) this.map.touchZoom.enable();
                if (this.map.doubleClickZoom) this.map.doubleClickZoom.enable();
            }
            // Volver a renderizar iconos en caso de que se abran diálogos
            setTimeout(() => {
                if (window.lucide) window.lucide.createIcons();
            }, 50);
        },

        setFilter(category) {
            this.activeFilter = category;
            this.selectedPoint = null;
            this.renderMarkers();
        },

        renderMarkers() {
            if (!this.markerGroup) return;
            this.markerGroup.clearLayers();

            if (!this.points || this.points.length === 0) return;

            const isMobile = L.Browser.mobile;
            const markers = [];
            
            this.points.forEach((p) => {
                if (p.lat == null || p.lon == null) return;
                
                // Filter by category
                if (this.activeFilter !== 'all' && p.category !== this.activeFilter) return;

                // Render ZBE polygon geometry (always drawn if visible)
                if (p.category === 'zbe') {
                    // Always render full polygon boundaries
                    const zbeLayer = L.geoJSON(p.geojson, {
                        style: {
                            color: p.accent,
                            fillColor: p.accent,
                            fillOpacity: 0.25,
                            weight: 2.5,
                            dashArray: '5, 5'
                        }
                    }).addTo(this.markerGroup);

                    if (isMobile) {
                        zbeLayer.on('click', (e) => {
                            this.selectedPoint = p;
                            L.DomEvent.stopPropagation(e);
                            setTimeout(() => {
                                if (window.lucide) window.lucide.createIcons();
                            }, 50);
                        });
                    } else {
                        zbeLayer.bindPopup(`
                            <div class="px-3 py-2 min-w-[180px]">
                                <p class="text-[9px] font-black uppercase tracking-widest mb-1" style="color: ${p.accent}">${this.escape(p.app_name)}</p>
                                <p class="text-sm font-bold text-slate-900 dark:text-white leading-snug">${this.escape(p.headline)}</p>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${this.escape(p.subline)}</p>
                                <a href="${p.url}" class="inline-flex items-center gap-1 mt-2 text-[10px] font-black uppercase tracking-widest" style="color: ${p.accent}">
                                    {% trans "Ver" %} →
                                </a>
                            </div>
                        `, { className: 'pulse-popup', maxWidth: 260, closeButton: false });
                    }

                    // Add visible centroid warning marker
                    const icon = L.divIcon({
                        className: '',
                        html: `
                            <div class="relative flex items-center justify-center">
                                <div class="absolute -inset-1.5 rounded-full opacity-35 animate-ping" style="background-color: ${p.accent};"></div>
                                <div class="relative w-7 h-7 rounded-full border-2 border-white dark:border-slate-800 shadow-md flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-95" style="background-color: ${p.accent};">
                                    <i data-lucide="${p.icon || 'map-pin'}" class="w-3.5 h-3.5 text-white"></i>
                                </div>
                            </div>
                        `,
                        iconSize: [28, 28],
                        iconAnchor: [14, 14],
                    });

                    const marker = L.marker([p.lat, p.lon], { icon }).addTo(this.markerGroup);
                    
                    if (isMobile) {
                        marker.on('click', (e) => {
                            this.selectedPoint = p;
                            L.DomEvent.stopPropagation(e);
                            setTimeout(() => {
                                if (window.lucide) window.lucide.createIcons();
                            }, 50);
                        });
                    } else {
                        marker.bindPopup(`
                            <div class="px-3 py-2 min-w-[180px]">
                                <p class="text-[9px] font-black uppercase tracking-widest mb-1" style="color: ${p.accent}">${this.escape(p.app_name)}</p>
                                <p class="text-sm font-bold text-slate-900 dark:text-white leading-snug">${this.escape(p.headline)}</p>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${this.escape(p.subline)}</p>
                                <a href="${p.url}" class="inline-flex items-center gap-1 mt-2 text-[10px] font-black uppercase tracking-widest" style="color: ${p.accent}">
                                    {% trans "Ver" %} →
                                </a>
                            </div>
                        `, { className: 'pulse-popup', maxWidth: 260, closeButton: false });
                    }

                    markers.push(marker);
                } else {
                    // Regular category markers
                    const icon = L.divIcon({
                        className: '',
                        html: `
                            <div class="relative flex items-center justify-center">
                                <div class="absolute -inset-1.5 rounded-full opacity-30 animate-ping" style="background-color: ${p.accent};"></div>
                                <div class="relative w-7 h-7 rounded-full border-2 border-white dark:border-slate-800 shadow-md flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-95" style="background-color: ${p.accent};">
                                    <i data-lucide="${p.icon || 'map-pin'}" class="w-3.5 h-3.5 text-white"></i>
                                </div>
                            </div>
                        `,
                        iconSize: [28, 28],
                        iconAnchor: [14, 14],
                    });

                    const marker = L.marker([p.lat, p.lon], { icon }).addTo(this.markerGroup);
                    
                    if (isMobile) {
                        marker.on('click', (e) => {
                            this.selectedPoint = p;
                            L.DomEvent.stopPropagation(e);
                            setTimeout(() => {
                                if (window.lucide) window.lucide.createIcons();
                            }, 50);
                        });
                    } else {
                        const sublineHtml = p.subline
                            ? `<p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${this.escape(p.subline)}</p>`
                            : '';
                        marker.bindPopup(`
                            <div class="px-3 py-2 min-w-[180px]">
                                <p class="text-[9px] font-black uppercase tracking-widest mb-1" style="color: ${p.accent}">${this.escape(p.app_name)}</p>
                                <p class="text-sm font-bold text-slate-900 dark:text-white leading-snug">${this.escape(p.headline)}</p>
                                ${sublineHtml}
                                <a href="${p.url}" class="inline-flex items-center gap-1 mt-2 text-[10px] font-black uppercase tracking-widest" style="color: ${p.accent}">
                                    {% trans "Ver" %} →
                                </a>
                            </div>
                        `, { className: 'pulse-popup', maxWidth: 260, closeButton: false });
                    }

                    markers.push(marker);
                }
            });

            // Fit bounds to visible markers/layers
            if (markers.length > 1) {
                this.map.fitBounds(this.markerGroup.getBounds().pad(0.2));
            } else if (markers.length === 1) {
                this.map.setView(markers[0].getLatLng(), 12);
            }

            // Trigger Lucide icon parsing
            setTimeout(() => {
                if (window.lucide) window.lucide.createIcons();
            }, 50);
        },

        escape(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            })[c]);
        },
    }
}
</script>
