{% extends "base.html" %}

{% block content %}
<script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

<!-- AMOLED Black Theme container -->
<div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;" class="bg-black font-sans overflow-hidden" id="follow-container">
    
    <!-- Map container (Full screen background) -->
    <div id="map" class="absolute top-0 left-0 w-full h-full z-0"></div>

    <!-- Top HUD Bar -->
    <div id="top-hud" class="absolute top-0 left-0 w-full z-10 bg-gradient-to-b from-black/80 to-transparent p-4 pt-6 flex justify-between items-start transition-opacity duration-300">
        <a href="{% url 'route_detail' route.id %}" class="bg-gray-900/50 backdrop-blur-sm border border-gray-700 text-white w-12 h-12 flex items-center justify-center rounded-full hover:bg-gray-800 transition shadow-lg">
            <span class="text-xl">←</span>
        </a>
        
        <div class="text-right">
            <div id="status-badge" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-[10px] font-black tracking-widest uppercase mb-1 shadow-lg backdrop-blur-sm">
                🟢 En Ruta
            </div>
            <div class="text-[10px] font-black text-gray-400 tracking-widest uppercase shadow-sm drop-shadow-md">Precisión GPS</div>
            <div id="gps-accuracy" class="text-lg font-black text-white leading-none drop-shadow-md">-- m</div>
        </div>
    </div>

    <!-- Red Danger Overlay (Off-route) -->
    <div id="danger-overlay" class="absolute top-0 left-0 w-full h-full border-[8px] border-red-600 bg-red-600/10 opacity-0 transition-opacity duration-300 z-20 flex flex-col items-center justify-center pointer-events-none gap-3">
        <!-- Flecha back-to-route (rota según bearing al punto más cercano) -->
        <div id="back-arrow-wrapper" class="w-28 h-28 text-red-500" style="transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1)">
            <svg viewBox="0 0 100 100" fill="currentColor" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-2xl animate-pulse">
                <path d="M50 8 L82 50 L62 50 L62 92 L38 92 L38 50 L18 50 Z" stroke="white" stroke-width="3" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="bg-red-600 text-white font-black text-xl uppercase tracking-widest px-5 py-2 rounded-xl shadow-2xl">
            ⚠️ Fuera de Ruta
        </div>
        <div class="bg-black/70 backdrop-blur-md text-white font-black text-2xl px-5 py-1 rounded-lg shadow-2xl border border-red-500/40">
            a <span id="off-route-distance">--</span> m
        </div>
    </div>

    <!-- Right-side FAB stack: Capas / Brújula / Recentrar -->
    <div id="fab-stack" class="absolute right-4 top-1/2 -translate-y-1/2 z-30 flex flex-col gap-3 transition-opacity duration-300">
        <button id="btn-layer" aria-label="Cambiar capa"
                class="w-12 h-12 rounded-full bg-gray-900/80 backdrop-blur-md border border-gray-700 text-white shadow-lg flex items-center justify-center text-lg active:scale-95 transition">
            <span id="btn-layer-icon">🛰️</span>
        </button>

        <button id="btn-compass" aria-label="Reiniciar orientación"
                class="w-12 h-12 rounded-full bg-gray-900/80 backdrop-blur-md border border-gray-700 text-white shadow-lg flex items-center justify-center active:scale-95 transition relative overflow-hidden">
            <div id="compass-inner" class="w-full h-full flex items-center justify-center relative" style="transition: transform 0.15s linear">
                <div class="absolute top-1 left-1/2 -translate-x-1/2 w-0 h-0" style="border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 7px solid #ef4444;"></div>
                <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-0 h-0" style="border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 7px solid #6b7280;"></div>
                <span id="compass-label" class="text-[10px] font-black text-white">N</span>
            </div>
        </button>

        <button id="btn-recenter" aria-label="Recentrar"
                class="w-12 h-12 rounded-full bg-emerald-600 text-white shadow-lg flex items-center justify-center text-lg active:scale-95 transition hidden">
            <span>📍</span>
        </button>
    </div>
    
    <!-- Unified Tactical Dashboard -->
    <div id="tactical-dashboard" class="absolute bottom-0 left-0 right-0 rounded-t-3xl shadow-2xl transition-all duration-500 ease-in-out flex flex-col overflow-hidden border-t border-white/10" style="height: 180px; z-index: 50; background-color: #111827;">
        
                <!-- Predictive Chart embedded as top header strip -->
        <div id="predictive-profile-container" class="relative w-full shrink-0 transition-opacity duration-300" style="height:70px;">
            <div class="absolute top-2 left-4 right-4 flex justify-between items-center z-10 pointer-events-none">
                <span class="text-[9px] font-black text-white/60 uppercase tracking-widest">Proximos 3 km</span>
                <span class="text-[10px] font-black text-emerald-400 uppercase tracking-widest" id="pred-ele-diff">--</span>
            </div>
            <div id="predictive-chart" class="absolute inset-0 w-full h-full opacity-90"></div>
            <div class="absolute bottom-0 left-0 w-full h-[3px] bg-gray-800">
                <div id="compact-progress-bar" class="h-full bg-emerald-500 transition-all duration-500" style="width:0%"></div>
            </div>
            <div class="absolute bottom-[3px] left-0 w-full h-[3px] flex overflow-hidden opacity-70" id="terrain-bar"></div>
        </div>

        <!-- Compact telemetry row -->
        <div id="view-compact" class="flex-1 flex flex-col justify-between px-4 py-3 transition-opacity duration-300">
            <div class="flex justify-between items-end">
                <div class="flex flex-col items-start">
                    <div class="text-[8px] font-black text-gray-500 uppercase tracking-widest">Tiempo</div>
                    <div class="text-[22px] font-black text-white leading-none font-mono tabular-nums" id="elapsed-time">00:00</div>
                </div>
                <div class="flex flex-col items-start">
                    <div class="text-[8px] font-black text-gray-500 uppercase tracking-widest">km/h</div>
                    <div class="text-[22px] font-black text-white leading-none tabular-nums" id="current-speed">0.0</div>
                </div>
                <div class="flex flex-col items-start">
                    <div class="text-[8px] font-black text-gray-500 uppercase tracking-widest">km</div>
                    <div class="text-[22px] font-black text-white leading-none tabular-nums" id="dist-traveled">0.00</div>
                </div>
                <div class="flex flex-col items-start">
                    <div class="text-[8px] font-black text-gray-500 uppercase tracking-widest">alt m</div>
                    <div class="text-[22px] font-black text-white leading-none tabular-nums" id="current-altitude">--</div>
                </div>
                <button class="w-10 h-10 bg-emerald-500 hover:bg-emerald-400 rounded-full flex items-center justify-center text-white shadow-lg shadow-emerald-500/20 active:scale-95 transition shrink-0 ml-1">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
            <div class="flex items-center justify-end mt-1">
                <div id="intel-alert" class="hidden bg-amber-500 text-amber-950 font-black text-[9px] uppercase tracking-widest px-2 py-0.5 rounded-full animate-pulse mr-auto">
                    Intel: <span id="intel-dist">--</span>m
                </div>
                <button class="text-gray-500 hover:text-white transition active:scale-95 dashboard-toggle p-1 cursor-pointer" aria-label="Expandir vista">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg>
                </button>
            </div>
        </div>

                <!-- EXPANDED VIEW (Strava style) -->
        <div id="view-expanded" class="absolute inset-0 pt-6 px-6 pb-8 flex flex-col justify-between opacity-0 pointer-events-none transition-opacity duration-300">
            
            <!-- Top section: Time & Collapse Toggle -->
            <div class="relative flex flex-col items-center pt-8">
                <!-- Collapse Button -->
                <button class="absolute top-0 right-0 p-3 text-white hover:text-gray-300 transition active:scale-95 dashboard-toggle z-50 bg-gray-800/50 rounded-full" aria-label="Colapsar vista">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"></path></svg>
                </button>
                <div class="font-black text-white leading-none font-mono tracking-tighter tabular-nums" style="font-size: 5rem;" id="fs-elapsed-time">00:00</div>
            </div>

            <!-- Huge Speed -->
            <div class="flex flex-col items-center justify-center flex-1 my-4">
                <div class="font-black text-white leading-none tabular-nums tracking-tighter" style="font-size: 7.5rem;" id="fs-current-speed">0.0</div>
                <div class="text-sm text-gray-300 font-bold mt-3">Velocidad (km/h)</div>
            </div>

            <!-- Bottom Grid (Dist, Alt, Rest, Prog) -->
            <div class="grid grid-cols-2 gap-y-10 gap-x-4 w-full px-2 mt-2">
                <div class="flex flex-col items-center">
                    <div class="font-black text-white leading-none tabular-nums tracking-tighter" style="font-size: 3.5rem;" id="fs-dist-traveled">0.00</div>
                    <div class="text-sm text-gray-400 font-bold mt-2">Distancia (km)</div>
                </div>
                <div class="flex flex-col items-center">
                    <div class="font-black text-[#f85c14] leading-none tabular-nums tracking-tighter" style="font-size: 3.5rem;" id="fs-dist-remaining">0.00</div>
                    <div class="text-sm text-gray-400 font-bold mt-2">Restante (km)</div>
                </div>
                <div class="flex flex-col items-center">
                    <div class="font-black text-white leading-none tabular-nums tracking-tighter" style="font-size: 3.5rem;" id="fs-current-altitude">--</div>
                    <div class="text-sm text-gray-400 font-bold mt-2">Altitud (m)</div>
                </div>
                <div class="flex flex-col items-center">
                    <div class="flex items-baseline gap-1">
                        <div class="font-black text-white leading-none tabular-nums tracking-tighter" style="font-size: 3.5rem;" id="fs-progress-pct">0</div>
                        <span class="text-2xl font-black text-gray-500">%</span>
                    </div>
                    <div class="text-sm text-gray-400 font-bold mt-2">Progreso</div>
                </div>
            </div>

            <!-- Giant Pause Button -->
            <button class="w-full text-white font-black text-xl tracking-widest py-5 rounded-full mt-10 shadow-lg active:scale-95 transition flex items-center justify-center gap-3" style="background-color: #f85c14;">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                Pausar
            </button>
        </div>
    </div>
</div>

<script>
    const rawGeojson = {{ route_geojson|safe }};
    const terrainGeojson = {{ terrain_geojson|safe }};
    const routeId = {{ route.id }};
    
    // Build Predictive Terrain Bar
    document.addEventListener('DOMContentLoaded', () => {
        const terrainBar = document.getElementById('terrain-bar');
        if (terrainBar && terrainGeojson.features) {
            let totalPts = 0;
            terrainGeojson.features.forEach(f => {
                if (f.geometry && f.geometry.coordinates) totalPts += f.geometry.coordinates.length;
            });
            if (totalPts > 0) {
                let html = '';
                terrainGeojson.features.forEach(f => {
                    const surface = f.properties.surface || 'unknown';
                    let color = '#34d399'; // Emerald default
                    if (['asphalt', 'paved', 'concrete', 'chipseal'].includes(surface)) color = '#ffffff'; // White (High contrast)
                    else if (['unpaved', 'compacted', 'fine_gravel', 'gravel'].includes(surface)) color = '#f59e0b'; // Amber
                    else if (['dirt', 'earth', 'ground', 'mud'].includes(surface)) color = '#b45309'; // Brown
                    else if (['grass', 'sand', 'wood'].includes(surface)) color = '#84cc16'; // Green
                    
                    const pct = (f.geometry.coordinates.length / totalPts) * 100;
                    html += `<div style="width: ${pct}%; background-color: ${color}; height: 100%;"></div>`;
                });
                terrainBar.innerHTML = html;
            }
        }
    });
    
    // Config
    const OFF_ROUTE_THRESHOLD_METERS = 50;
    const INTEL_ALERT_THRESHOLD_METERS = 500;
    
    // State
    let isOffRoute = false;
    let intelDrops = [];
    let alertedIntelIds = new Set();
    let userMarker = null;
    let watchId = null;
    let autoFollow = true;
    let lastUserPos = null;
    let layerMode = 'dark'; // 'dark' | 'satellite'
    
    // Telemetry State
    let startTime = null;
    let timerInterval = null;
    let smoothedSpeed = 0;

    // Predictive Profile State
    let fullProfileData = [];
    let predictiveChart = null;
    let hasElevationData = false;

    function initPredictiveData() {
        if (!window.echarts || !window.turf) return;
        
        let coords = rawGeojson.type === 'Feature' ? rawGeojson.geometry.coordinates : rawGeojson.coordinates;
        if (rawGeojson.type === 'MultiLineString') coords = coords.flat(1);
        if (!coords || coords.length === 0) return;

        hasElevationData = coords[0].length >= 3;
        let cumulativeDist = 0;
        
        for (let i = 0; i < coords.length; i++) {
            if (i > 0) {
                const p1 = turf.point(coords[i-1]);
                const p2 = turf.point(coords[i]);
                cumulativeDist += turf.distance(p1, p2, {units: 'kilometers'});
            }
            let ele = hasElevationData ? coords[i][2] : (100 + Math.sin(cumulativeDist * 5) * 50 + cumulativeDist * 10);
            fullProfileData.push([cumulativeDist, ele]);
        }

        const chartEl = document.getElementById('predictive-chart');
        if (chartEl) {
            predictiveChart = echarts.init(chartEl);
        }
    }

    document.addEventListener('DOMContentLoaded', initPredictiveData);

    function updateTimer() {
        if (!startTime) return;
        const diffSecs = Math.floor((Date.now() - startTime) / 1000);
        const h = Math.floor(diffSecs / 3600);
        const m = Math.floor((diffSecs % 3600) / 60);
        const s = diffSecs % 60;
        let timeStr = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        if (h > 0) timeStr = `${h}:${timeStr}`;
        document.getElementById('elapsed-time').innerText = timeStr;
        document.getElementById('fs-elapsed-time').innerText = timeStr;
    }
    
    // Unified Dashboard Toggle Logic
    const dashboard = document.getElementById('tactical-dashboard');
    const viewCompact = document.getElementById('view-compact');
    const viewExpanded = document.getElementById('view-expanded');
    let dashboardExpanded = false;

    function toggleDashboard() {
        dashboardExpanded = !dashboardExpanded;
        if (dashboardExpanded) {
            dashboard.classList.remove('bottom-0', 'left-0', 'right-0', 'rounded-t-3xl');
            dashboard.classList.add('bottom-0', 'left-0', 'right-0', 'rounded-none');
            dashboard.style.height = '100%';
            
            // Fade out Top HUD and FABs
            document.getElementById('top-hud').style.opacity = '0';
            document.getElementById('top-hud').style.pointerEvents = 'none';
            document.getElementById('fab-stack').style.opacity = '0';
            document.getElementById('fab-stack').style.pointerEvents = 'none';
            
            // Crossfade views
            viewCompact.style.opacity = '0';
            viewCompact.style.pointerEvents = 'none';
            viewExpanded.style.opacity = '1';
            viewExpanded.style.pointerEvents = 'auto';
            
            // Hide predictive profile
            const predProfile = document.getElementById('predictive-profile-container');
            if (predProfile) {
                predProfile.style.opacity = '0';
                predProfile.style.pointerEvents = 'none';
            }
            
            
        } else {
            dashboard.classList.remove('rounded-none');
            dashboard.classList.add('rounded-t-3xl');
            dashboard.style.height = '180px';
            setTimeout(function() { if (typeof predictiveChart !== 'undefined' && predictiveChart) predictiveChart.resize(); }, 520);
            
            // Fade in Top HUD and FABs
            document.getElementById('top-hud').style.opacity = '1';
            document.getElementById('top-hud').style.pointerEvents = 'auto';
            document.getElementById('fab-stack').style.opacity = '1';
            document.getElementById('fab-stack').style.pointerEvents = 'auto';
            
            // Crossfade views
            viewExpanded.style.opacity = '0';
            viewExpanded.style.pointerEvents = 'none';
            viewCompact.style.opacity = '1';
            viewCompact.style.pointerEvents = 'auto';

            // Show predictive profile
            const predProfile = document.getElementById('predictive-profile-container');
            if (predProfile) {
                predProfile.style.opacity = '1';
            }
        }
    }

    // Bind toggles
    document.querySelectorAll('.dashboard-toggle').forEach(el => el.addEventListener('click', toggleDashboard));

    // Route geometry: rawGeojson is a MultiLineString — turf.pointToLineDistance
    // y nearestPointOnLine solo aceptan LineString, así que iteramos por segmento.
    const subLines = rawGeojson.coordinates.map(coords => turf.lineString(coords));
    const subLineLengths = subLines.map(line => turf.length(line, { units: 'kilometers' }));
    const cumulativeLengthsKm = []; // longitud acumulada al inicio de cada segmento
    let _acc = 0;
    subLineLengths.forEach(len => { cumulativeLengthsKm.push(_acc); _acc += len; });
    const totalRouteKm = _acc;

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: rawGeojson.coordinates[0][0], // Start of route
        zoom: 16,
        pitch: 60,
        bearing: 0,
        attributionControl: false
    });

    // (route geometry pre-procesada arriba como subLines/cumulativeLengthsKm)

    map.on('load', () => {
        // Force AMOLED Black background to save battery
        map.setPaintProperty('background', 'background-color', '#000000');

        // Satellite source (initially hidden, used by layer toggle)
        map.addSource('satellite', {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256,
            attribution: '&copy; Esri'
        });
        map.addLayer({
            id: 'sat-layer',
            type: 'raster',
            source: 'satellite',
            layout: { visibility: 'none' }
        });

        // Add Route Source
        map.addSource('route', {
            type: 'geojson',
            data: {
                type: 'Feature',
                properties: {},
                geometry: rawGeojson
            }
        });
        
        map.addSource('terrain-route', {
            type: 'geojson',
            data: terrainGeojson
        });
        
        // Outer glow
        map.addLayer({
            id: 'route-glow',
            type: 'line',
            source: 'route',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 'line-color': '#10b981', 'line-width': 12, 'line-opacity': 0.2, 'line-blur': 10 }
        });
        
        // Inner core (Data-Driven Styling based on terrain)
        map.addLayer({
            id: 'route-core',
            type: 'line',
            source: 'terrain-route',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 
                'line-color': [
                    'match',
                    ['get', 'surface'],
                    ['asphalt', 'paved', 'concrete', 'chipseal'], '#ffffff',
                    ['unpaved', 'compacted', 'fine_gravel', 'gravel'], '#f59e0b',
                    ['dirt', 'earth', 'ground', 'mud'], '#b45309',
                    ['grass', 'sand', 'wood'], '#84cc16',
                    '#34d399' // fallback
                ],
                'line-width': 4 
            }
        });

        // Create User Marker Element (Blue dot + Tactical FOV Cone)
        const userElWrapper = document.createElement('div');
        userElWrapper.className = 'relative flex items-center justify-center w-32 h-32 pointer-events-none';
        
        // FOV Cone (starts pointing UP, which is 0 degrees North)
        const fovCone = document.createElement('div');
        fovCone.id = 'fov-cone';
        fovCone.className = 'absolute opacity-0 transition-opacity duration-700';
        fovCone.style.width = '160px';
        fovCone.style.height = '160px';
        fovCone.style.bottom = '50%';
        fovCone.style.left = '50%';
        fovCone.style.transform = 'translateX(-50%)';
        fovCone.style.transformOrigin = '50% 100%';
        fovCone.style.background = 'radial-gradient(circle at 50% 100%, rgba(56, 189, 248, 0.6) 0%, rgba(56, 189, 248, 0) 60%)';
        fovCone.style.clipPath = 'polygon(50% 100%, 20% 0, 80% 0)';
        
        // Inner blue dot
        const dot = document.createElement('div');
        dot.className = 'w-5 h-5 rounded-full bg-sky-500 border-[3px] border-white shadow-[0_0_15px_rgba(56,189,248,0.8)] z-10 relative';

        userElWrapper.appendChild(fovCone);
        userElWrapper.appendChild(dot);
        
        userMarker = new maplibregl.Marker({ 
            element: userElWrapper,
            rotationAlignment: 'map',
            pitchAlignment: 'map'
        })
            .setLngLat(rawGeojson.coordinates[0][0])
            .addTo(map);

        // Fetch Intel Drops
        fetch(`/api/adventure/intel/route/${routeId}`)
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    intelDrops = data.intel;
                    // Add Intel markers
                    intelDrops.forEach(drop => {
                        const el = document.createElement('div');
                        el.className = 'w-8 h-8 rounded-full bg-gray-900 border-2 border-amber-500 flex items-center justify-center text-xs shadow-lg z-0';
                        el.innerHTML = getIntelIcon(drop.type);
                        new maplibregl.Marker({ element: el }).setLngLat([drop.lng, drop.lat]).addTo(map);
                    });
                }
            });

        // Start GPS Watch
        startTracking();
    });

    // === Compass: sync visual with map bearing ===
    const compassInner = document.getElementById('compass-inner');
    const compassLabel = document.getElementById('compass-label');
    const btnCompass = document.getElementById('btn-compass');
    function updateCompassVisual() {
        const bearing = map.getBearing();
        compassInner.style.transform = `rotate(${-bearing}deg)`;
        const norm = ((bearing % 360) + 360) % 360;
        let label = 'N';
        if (norm >= 45 && norm < 135) label = 'E';
        else if (norm >= 135 && norm < 225) label = 'S';
        else if (norm >= 225 && norm < 315) label = 'O';
        compassLabel.style.transform = `rotate(${bearing}deg)`;
        compassLabel.innerText = label;
        updateBackArrow(); // la flecha off-route depende del bearing del mapa
    }
    map.on('rotate', updateCompassVisual);
    map.on('rotateend', updateCompassVisual);

    // === Heading-up mode (mapa rota con el dispositivo) ===
    let headingUpMode = false;
    let deviceHeading = null;
    let smoothedHeading = null;

    function onOrientation(event) {
        let raw;
        if (event.webkitCompassHeading !== undefined) {
            raw = event.webkitCompassHeading; // iOS, ya en sentido horario desde N
        } else if (event.absolute && event.alpha !== null) {
            raw = (360 - event.alpha) % 360; // Android
        } else {
            return;
        }
        // Filtro paso-bajo para evitar saltos por ruido del magnetómetro
        if (smoothedHeading === null) smoothedHeading = raw;
        else {
            const diff = ((raw - smoothedHeading + 540) % 360) - 180;
            smoothedHeading = (smoothedHeading + diff * 0.25 + 360) % 360;
        }
        deviceHeading = smoothedHeading;
        
        // Update Marker Rotation and make cone visible
        if (userMarker) userMarker.setRotation(deviceHeading);
        const cone = document.getElementById('fov-cone');
        if (cone) cone.classList.remove('opacity-0');

        if (headingUpMode) {
            const current = map.getBearing();
            const diff = ((deviceHeading - current + 540) % 360) - 180;
            if (Math.abs(diff) > 1) map.setBearing(deviceHeading);
        }
    }

    async function enableHeadingUp() {
        // iOS 13+ requiere pedir permiso desde gesto del usuario
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const perm = await DeviceOrientationEvent.requestPermission();
                if (perm !== 'granted') return false;
            } catch (e) { return false; }
        }
        window.addEventListener('deviceorientationabsolute', onOrientation, true);
        window.addEventListener('deviceorientation', onOrientation, true);
        headingUpMode = true;
        btnCompass.classList.add('ring-2', 'ring-emerald-400', 'bg-emerald-600/30');
        btnCompass.classList.remove('bg-gray-900/80');
        return true;
    }

    function disableHeadingUp() {
        headingUpMode = false;
        window.removeEventListener('deviceorientationabsolute', onOrientation, true);
        window.removeEventListener('deviceorientation', onOrientation, true);
        btnCompass.classList.remove('ring-2', 'ring-emerald-400', 'bg-emerald-600/30');
        btnCompass.classList.add('bg-gray-900/80');
        map.easeTo({ bearing: 0, pitch: 60, duration: 500 });
    }

    btnCompass.addEventListener('click', async () => {
        if (headingUpMode) {
            disableHeadingUp();
        } else {
            const ok = await enableHeadingUp();
            if (!ok) {
                // Sin permiso/sensor → fallback: snap a Norte
                map.easeTo({ bearing: 0, pitch: 60, duration: 600 });
            }
        }
    });

    // === Flecha back-to-route: actualiza rotación al moverse el mapa ===
    let offRouteBearing = 0; // último bearing geográfico hacia el punto más cercano
    function updateBackArrow() {
        if (!isOffRoute) return;
        const rotation = offRouteBearing - map.getBearing();
        const el = document.getElementById('back-arrow-wrapper');
        if (el) el.style.transform = `rotate(${rotation}deg)`;
    }

    // === Layer toggle: dark <-> satellite overlay ===
    document.getElementById('btn-layer').addEventListener('click', () => {
        if (layerMode === 'dark') {
            map.setLayoutProperty('sat-layer', 'visibility', 'visible');
            document.getElementById('btn-layer-icon').innerText = '🌙';
            layerMode = 'satellite';
        } else {
            map.setLayoutProperty('sat-layer', 'visibility', 'none');
            document.getElementById('btn-layer-icon').innerText = '🛰️';
            layerMode = 'dark';
        }
    });

    // === Recenter button ===
    const btnRecenter = document.getElementById('btn-recenter');
    btnRecenter.addEventListener('click', () => {
        if (!lastUserPos) return;
        autoFollow = true;
        btnRecenter.classList.add('hidden');
        // Si heading-up está activo, conserva el bearing del dispositivo
        const targetBearing = headingUpMode && deviceHeading !== null ? deviceHeading : 0;
        map.flyTo({ center: lastUserPos, zoom: 16, bearing: targetBearing, pitch: 60, duration: 600 });
    });

    // === Detect user pan/zoom: disable auto-follow ===
    map.on('dragstart', () => {
        if (autoFollow) {
            autoFollow = false;
            btnRecenter.classList.remove('hidden');
        }
    });

    function getIntelIcon(type) {
        const icons = { 'warning': '⚠️', 'photo_epic': '📸', 'water_ok': '💧', 'water_dry': '🏜️', 'surface_mud': '💩', 'surface_snow': '❄️', 'shelter_ok': '⛺', 'shelter_bad': '🏚️' };
        return icons[type] || '📍';
    }

    function startTracking() {
        if (!("geolocation" in navigator)) {
            alert("Tu navegador no soporta GPS.");
            return;
        }
        
        // Request Screen Wake Lock
        try {
            if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').catch(() => console.log("Wake lock refused"));
            }
        } catch(e) {}

        watchId = navigator.geolocation.watchPosition(
            (position) => {
                const lng = position.coords.longitude;
                const lat = position.coords.latitude;
                const accuracy = position.coords.accuracy;
                const speedMs = position.coords.speed; // m/s
                const altitude = position.coords.altitude; // m
                
                // Start Timer on first lock
                if (!startTime) {
                    startTime = Date.now();
                    timerInterval = setInterval(updateTimer, 1000);
                }

                // Update Telemetry UI
                document.getElementById('gps-accuracy').innerText = `±${accuracy.toFixed(0)}m`;
                if (speedMs !== null) {
                    const kmh = speedMs * 3.6;
                    smoothedSpeed = smoothedSpeed * 0.7 + kmh * 0.3; // Low-pass filter for smooth speed
                    const speedStr = Math.max(0, smoothedSpeed).toFixed(1);
                    document.getElementById('current-speed').innerText = speedStr;
                    document.getElementById('fs-current-speed').innerText = speedStr;
                }
                if (altitude !== null) {
                    const altStr = Math.round(altitude);
                    document.getElementById('current-altitude').innerText = altStr;
                    document.getElementById('fs-current-altitude').innerText = altStr;
                }

                // Move marker
                userMarker.setLngLat([lng, lat]);
                lastUserPos = [lng, lat];

                // Center Map (smooth follow) only if user hasn't taken control
                if (autoFollow) {
                    // easeTo solo center: no toca bearing (importante para heading-up)
                    map.easeTo({ center: [lng, lat], duration: 800 });
                }

                // Turf checks
                runSentinelChecks(lng, lat);
            },
            (error) => {
                console.error(error);
                document.getElementById('status-badge').className = "bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1 rounded-full text-[10px] font-black tracking-widest uppercase mb-1 shadow-lg backdrop-blur-sm";
                document.getElementById('status-badge').innerText = "❌ Sin GPS";
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
    }

    function runSentinelChecks(lng, lat) {
        const currentPt = turf.point([lng, lat]);

        // 0. Encontrar segmento más cercano (iteramos toda la MultiLineString)
        let bestDistanceKm = Infinity;
        let bestSegmentIdx = 0;
        let bestSnapped = null;
        subLines.forEach((line, i) => {
            const snapped = turf.nearestPointOnLine(line, currentPt, { units: 'kilometers' });
            const d = snapped.properties.dist; // distancia ortogonal al segmento en km
            if (d < bestDistanceKm) {
                bestDistanceKm = d;
                bestSegmentIdx = i;
                bestSnapped = snapped;
            }
        });

        // Progress calculations
        const traveledKm = cumulativeLengthsKm[bestSegmentIdx] + (bestSnapped?.properties.location || 0);
        const remainingKm = Math.max(0, totalRouteKm - traveledKm);
        const progressPct = totalRouteKm > 0 ? Math.min(100, Math.max(0, (traveledKm / totalRouteKm) * 100)) : 0;

        // Distancia recorrida
        document.getElementById('dist-traveled').innerText = traveledKm.toFixed(2);
        document.getElementById('fs-dist-traveled').innerText = traveledKm.toFixed(2);
        
        // Restante y Progreso
        document.getElementById('fs-dist-remaining').innerText = remainingKm.toFixed(2);
        document.getElementById('fs-progress-pct').innerText = Math.round(progressPct);
        document.getElementById('compact-progress-bar').style.width = `${progressPct}%`;
        
        // Actualizar Perfil Predictivo
        updatePredictiveProfile(traveledKm);
        
        // 1. Off-Route Check (distancia al segmento más cercano de la ruta completa)
        const distanceMeters = bestDistanceKm * 1000;
        
        const dangerOverlay = document.getElementById('danger-overlay');
        const statusBadge = document.getElementById('status-badge');
        
        if (distanceMeters > OFF_ROUTE_THRESHOLD_METERS) {
            if (!isOffRoute) {
                isOffRoute = true;
                dangerOverlay.classList.remove('opacity-0');
                statusBadge.className = "bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1 rounded-full text-[10px] font-black tracking-widest uppercase mb-1 shadow-lg backdrop-blur-sm";
                statusBadge.innerText = "❌ PELIGRO";
                if(navigator.vibrate) navigator.vibrate([500, 200, 500]); // Aggressive vibrate
            }
            // Actualiza distancia + flecha al punto más cercano
            if (bestSnapped) {
                document.getElementById('off-route-distance').innerText = Math.round(distanceMeters);
                offRouteBearing = turf.bearing(currentPt, bestSnapped); // -180..180, 0 = N geográfico
                updateBackArrow();
            }
        } else {
            if (isOffRoute) {
                isOffRoute = false;
                dangerOverlay.classList.add('opacity-0');
                statusBadge.className = "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-[10px] font-black tracking-widest uppercase mb-1 shadow-lg backdrop-blur-sm";
                statusBadge.innerText = "🟢 En Ruta";
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]); // Friendly vibrate
            }
        }

        // 2. Proximity Intel Alerts
        intelDrops.forEach(drop => {
            if (alertedIntelIds.has(drop.id)) return;
            
            const dropPt = turf.point([drop.lng, drop.lat]);
            const distKm = turf.distance(currentPt, dropPt);
            const distM = Math.round(distKm * 1000);
            
            if (distM < INTEL_ALERT_THRESHOLD_METERS) {
                // Trigger Alert
                alertedIntelIds.add(drop.id);
                if(navigator.vibrate) navigator.vibrate([300, 100, 300]);
                
                const alertDiv = document.getElementById('intel-alert');
                const distSpan = document.getElementById('intel-dist');
                const descSpan = document.getElementById('intel-desc');
                
                alertDiv.classList.remove('hidden');
                distSpan.innerText = distM;
                descSpan.innerHTML = `<span class="font-bold text-amber-500">${getIntelIcon(drop.type)} ${drop.type_display}</span>: ${drop.description}`;
                
                // Hide alert after 15 seconds
                setTimeout(() => {
                    alertDiv.classList.add('hidden');
                    descSpan.innerText = "Vigilando perímetro...";
                }, 15000);
            }
        });
    }

    // Cleanup on exit
    window.addEventListener('beforeunload', () => {
        if(watchId) navigator.geolocation.clearWatch(watchId);
    });

    map.on('error', (e) => {
        console.error("MapLibre Error:", e);
    });

    function updatePredictiveProfile(currentKm) {
        if (!predictiveChart || fullProfileData.length === 0) return;

        const forwardKm = 3.0; // Mostrar los próximos 3km
        const endKm = currentKm + forwardKm;

        let windowData = [];
        let minEle = 9999;
        let maxEle = -9999;

        for (let i = 0; i < fullProfileData.length; i++) {
            const pt = fullProfileData[i];
            if (pt[0] >= currentKm && pt[0] <= endKm) {
                const relDist = pt[0] - currentKm;
                windowData.push([relDist, pt[1]]);
                minEle = Math.min(minEle, pt[1]);
                maxEle = Math.max(maxEle, pt[1]);
            }
        }

        if (windowData.length === 0) return;

        const currentEle = windowData[0][1];
        const endEle = windowData[windowData.length - 1][1];
        const diff = endEle - currentEle;
        const diffEl = document.getElementById('pred-ele-diff');
        
        if (diff > 0) {
            diffEl.innerText = `+${Math.round(diff)}m ↗`;
            diffEl.className = "text-[10px] font-black text-red-500 uppercase tracking-widest";
        } else {
            diffEl.innerText = `${Math.round(diff)}m ↘`;
            diffEl.className = "text-[10px] font-black text-emerald-400 uppercase tracking-widest";
        }

        const option = {
            animation: false, 
            grid: { top: 5, right: 0, bottom: 5, left: 0 },
            xAxis: { type: 'value', min: 0, max: forwardKm, show: false },
            yAxis: { type: 'value', min: Math.floor(minEle / 50) * 50, max: Math.ceil(maxEle / 50) * 50, show: false },
            visualMap: {
                show: false,
                dimension: 1,
                min: minEle,
                max: maxEle,
                inRange: { color: ['#10b981', '#f59e0b', '#ef4444'] }
            },
            series: [{
                type: 'line',
                data: windowData,
                smooth: 0.3,
                symbol: 'none',
                lineStyle: { width: 3 },
                areaStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: 'rgba(239, 68, 68, 0.4)' },
                        { offset: 1, color: 'rgba(239, 68, 68, 0.0)' }
                    ])
                }
            }]
        };

        predictiveChart.setOption(option);
    }
