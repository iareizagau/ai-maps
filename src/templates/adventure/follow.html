{% extends "base.html" %}

{% block content %}
<script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<!-- AMOLED Black Theme container -->
<div style="height: calc(100vh - 72px);" class="w-full relative bg-black font-sans overflow-hidden" id="follow-container">
    
    <!-- Map container (Full screen background) -->
    <div id="map" class="absolute top-0 left-0 w-full h-full z-0"></div>

    <!-- Top HUD Bar -->
    <div class="absolute top-0 left-0 w-full z-10 bg-gradient-to-b from-black/80 to-transparent p-4 pt-6 flex justify-between items-start">
        <a href="{% url 'route_detail' route.id %}" class="bg-gray-900/50 backdrop-blur-sm border border-gray-700 text-white w-12 h-12 flex items-center justify-center rounded-full hover:bg-gray-800 transition shadow-lg">
            <span class="text-xl">←</span>
        </a>
        
        <div class="text-right">
            <div id="status-badge" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-[10px] font-black tracking-widest uppercase mb-1 shadow-lg backdrop-blur-sm">
                🟢 En Ruta
            </div>
            <div class="text-[10px] font-black text-gray-400 tracking-widest uppercase shadow-sm drop-shadow-md">Precisión GPS</div>
            <div id="gps-accuracy" class="text-lg font-black text-white leading-none drop-shadow-md">-- m</div>
        </div>
    </div>

    <!-- Red Danger Overlay (Off-route) -->
    <div id="danger-overlay" class="absolute top-0 left-0 w-full h-full border-[8px] border-red-600 bg-red-600/10 opacity-0 transition-opacity duration-300 z-20 flex flex-col items-center justify-center pointer-events-none gap-3">
        <!-- Flecha back-to-route (rota según bearing al punto más cercano) -->
        <div id="back-arrow-wrapper" class="w-28 h-28 text-red-500" style="transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1)">
            <svg viewBox="0 0 100 100" fill="currentColor" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-2xl animate-pulse">
                <path d="M50 8 L82 50 L62 50 L62 92 L38 92 L38 50 L18 50 Z" stroke="white" stroke-width="3" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="bg-red-600 text-white font-black text-xl uppercase tracking-widest px-5 py-2 rounded-xl shadow-2xl">
            ⚠️ Fuera de Ruta
        </div>
        <div class="bg-black/70 backdrop-blur-md text-white font-black text-2xl px-5 py-1 rounded-lg shadow-2xl border border-red-500/40">
            a <span id="off-route-distance">--</span> m
        </div>
    </div>

    <!-- Right-side FAB stack: Capas / Brújula / Recentrar -->
    <div class="absolute right-4 top-1/2 -translate-y-1/2 z-30 flex flex-col gap-3">
        <button id="btn-layer" aria-label="Cambiar capa"
                class="w-12 h-12 rounded-full bg-gray-900/80 backdrop-blur-md border border-gray-700 text-white shadow-lg flex items-center justify-center text-lg active:scale-95 transition">
            <span id="btn-layer-icon">🛰️</span>
        </button>

        <button id="btn-compass" aria-label="Reiniciar orientación"
                class="w-12 h-12 rounded-full bg-gray-900/80 backdrop-blur-md border border-gray-700 text-white shadow-lg flex items-center justify-center active:scale-95 transition relative overflow-hidden">
            <div id="compass-inner" class="w-full h-full flex items-center justify-center relative" style="transition: transform 0.15s linear">
                <div class="absolute top-1 left-1/2 -translate-x-1/2 w-0 h-0" style="border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 7px solid #ef4444;"></div>
                <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-0 h-0" style="border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 7px solid #6b7280;"></div>
                <span id="compass-label" class="text-[10px] font-black text-white">N</span>
            </div>
        </button>

        <button id="btn-recenter" aria-label="Recentrar"
                class="w-12 h-12 rounded-full bg-emerald-600 text-white shadow-lg flex items-center justify-center text-lg active:scale-95 transition hidden">
            <span>📍</span>
        </button>
    </div>
    
    <!-- Bottom HUD Bar -->
    <div class="absolute bottom-0 left-0 w-full z-10 bg-gradient-to-t from-black/90 to-transparent p-6 pb-8">
        <div class="bg-gray-900/80 backdrop-blur-md border border-gray-800 rounded-2xl p-4 max-w-sm mx-auto shadow-2xl relative overflow-hidden">
            <!-- Intel Alert Banner (Hidden by default) -->
            <div id="intel-alert" class="hidden absolute top-0 left-0 w-full bg-amber-500 text-amber-950 font-black text-[10px] uppercase tracking-widest py-1 text-center animate-pulse">
                Intel Detectado a <span id="intel-dist">--</span>m
            </div>
            
            <h3 class="font-bold text-white mb-2 mt-2 text-center truncate px-2">{{ route.name }}</h3>

            <div class="grid grid-cols-2 gap-2 mb-2 px-2">
                <div class="bg-black/40 rounded-xl px-3 py-2 text-center border border-gray-800">
                    <div class="text-[9px] font-black text-gray-500 uppercase tracking-widest mb-0.5">Restante</div>
                    <div class="text-lg font-black text-emerald-400 leading-none"><span id="dist-remaining">--</span><span class="text-[10px] text-gray-500 font-bold ml-1">km</span></div>
                </div>
                <div class="bg-black/40 rounded-xl px-3 py-2 text-center border border-gray-800">
                    <div class="text-[9px] font-black text-gray-500 uppercase tracking-widest mb-0.5">Progreso</div>
                    <div class="text-lg font-black text-white leading-none"><span id="progress-pct">--</span><span class="text-[10px] text-gray-500 font-bold ml-1">%</span></div>
                </div>
            </div>

            <p id="intel-desc" class="text-xs text-gray-400 text-center line-clamp-2 px-2">Vigilando perímetro...</p>
        </div>
    </div>
</div>

<script>
    const rawGeojson = {{ route_geojson|safe }};
    const routeId = {{ route.id }};
    
    // Config
    const OFF_ROUTE_THRESHOLD_METERS = 50;
    const INTEL_ALERT_THRESHOLD_METERS = 500;
    
    // State
    let isOffRoute = false;
    let intelDrops = [];
    let alertedIntelIds = new Set();
    let userMarker = null;
    let watchId = null;
    let autoFollow = true;
    let lastUserPos = null;
    let layerMode = 'dark'; // 'dark' | 'satellite'

    // Route geometry: rawGeojson is a MultiLineString — turf.pointToLineDistance
    // y nearestPointOnLine solo aceptan LineString, así que iteramos por segmento.
    const subLines = rawGeojson.coordinates.map(coords => turf.lineString(coords));
    const subLineLengths = subLines.map(line => turf.length(line, { units: 'kilometers' }));
    const cumulativeLengthsKm = []; // longitud acumulada al inicio de cada segmento
    let _acc = 0;
    subLineLengths.forEach(len => { cumulativeLengthsKm.push(_acc); _acc += len; });
    const totalRouteKm = _acc;

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: rawGeojson.coordinates[0][0], // Start of route
        zoom: 16,
        pitch: 60,
        bearing: 0,
        attributionControl: false
    });

    // (route geometry pre-procesada arriba como subLines/cumulativeLengthsKm)

    map.on('load', () => {
        // Force AMOLED Black background to save battery
        map.setPaintProperty('background', 'background-color', '#000000');

        // Satellite source (initially hidden, used by layer toggle)
        map.addSource('satellite', {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256,
            attribution: '&copy; Esri'
        });
        map.addLayer({
            id: 'sat-layer',
            type: 'raster',
            source: 'satellite',
            layout: { visibility: 'none' }
        });

        // Add Route Source
        map.addSource('route', {
            type: 'geojson',
            data: {
                type: 'Feature',
                properties: {},
                geometry: rawGeojson
            }
        });
        
        // Outer glow
        map.addLayer({
            id: 'route-glow',
            type: 'line',
            source: 'route',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 'line-color': '#10b981', 'line-width': 12, 'line-opacity': 0.2, 'line-blur': 10 }
        });
        
        // Inner core
        map.addLayer({
            id: 'route-core',
            type: 'line',
            source: 'route',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 'line-color': '#34d399', 'line-width': 4 }
        });

        // Create User Marker Element (Blue pulsing dot)
        const userEl = document.createElement('div');
        userEl.className = 'w-6 h-6 rounded-full bg-blue-500 border-4 border-white shadow-[0_0_20px_rgba(59,130,246,0.8)] transition-transform duration-1000';
        
        userMarker = new maplibregl.Marker({ element: userEl })
            .setLngLat(rawGeojson.coordinates[0][0])
            .addTo(map);

        // Fetch Intel Drops
        fetch(`/api/adventure/intel/route/${routeId}`)
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    intelDrops = data.intel;
                    // Add Intel markers
                    intelDrops.forEach(drop => {
                        const el = document.createElement('div');
                        el.className = 'w-8 h-8 rounded-full bg-gray-900 border-2 border-amber-500 flex items-center justify-center text-xs shadow-lg z-0';
                        el.innerHTML = getIntelIcon(drop.type);
                        new maplibregl.Marker({ element: el }).setLngLat([drop.lng, drop.lat]).addTo(map);
                    });
                }
            });

        // Start GPS Watch
        startTracking();
    });

    // === Compass: sync visual with map bearing ===
    const compassInner = document.getElementById('compass-inner');
    const compassLabel = document.getElementById('compass-label');
    const btnCompass = document.getElementById('btn-compass');
    function updateCompassVisual() {
        const bearing = map.getBearing();
        compassInner.style.transform = `rotate(${-bearing}deg)`;
        const norm = ((bearing % 360) + 360) % 360;
        let label = 'N';
        if (norm >= 45 && norm < 135) label = 'E';
        else if (norm >= 135 && norm < 225) label = 'S';
        else if (norm >= 225 && norm < 315) label = 'O';
        compassLabel.style.transform = `rotate(${bearing}deg)`;
        compassLabel.innerText = label;
        updateBackArrow(); // la flecha off-route depende del bearing del mapa
    }
    map.on('rotate', updateCompassVisual);
    map.on('rotateend', updateCompassVisual);

    // === Heading-up mode (mapa rota con el dispositivo) ===
    let headingUpMode = false;
    let deviceHeading = null;
    let smoothedHeading = null;

    function onOrientation(event) {
        let raw;
        if (event.webkitCompassHeading !== undefined) {
            raw = event.webkitCompassHeading; // iOS, ya en sentido horario desde N
        } else if (event.absolute && event.alpha !== null) {
            raw = (360 - event.alpha) % 360; // Android
        } else {
            return;
        }
        // Filtro paso-bajo para evitar saltos por ruido del magnetómetro
        if (smoothedHeading === null) smoothedHeading = raw;
        else {
            const diff = ((raw - smoothedHeading + 540) % 360) - 180;
            smoothedHeading = (smoothedHeading + diff * 0.25 + 360) % 360;
        }
        deviceHeading = smoothedHeading;
        if (headingUpMode) {
            const current = map.getBearing();
            const diff = ((deviceHeading - current + 540) % 360) - 180;
            if (Math.abs(diff) > 1) map.setBearing(deviceHeading);
        }
    }

    async function enableHeadingUp() {
        // iOS 13+ requiere pedir permiso desde gesto del usuario
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const perm = await DeviceOrientationEvent.requestPermission();
                if (perm !== 'granted') return false;
            } catch (e) { return false; }
        }
        window.addEventListener('deviceorientationabsolute', onOrientation, true);
        window.addEventListener('deviceorientation', onOrientation, true);
        headingUpMode = true;
        btnCompass.classList.add('ring-2', 'ring-emerald-400', 'bg-emerald-600/30');
        btnCompass.classList.remove('bg-gray-900/80');
        return true;
    }

    function disableHeadingUp() {
        headingUpMode = false;
        window.removeEventListener('deviceorientationabsolute', onOrientation, true);
        window.removeEventListener('deviceorientation', onOrientation, true);
        btnCompass.classList.remove('ring-2', 'ring-emerald-400', 'bg-emerald-600/30');
        btnCompass.classList.add('bg-gray-900/80');
        map.easeTo({ bearing: 0, pitch: 60, duration: 500 });
    }

    btnCompass.addEventListener('click', async () => {
        if (headingUpMode) {
            disableHeadingUp();
        } else {
            const ok = await enableHeadingUp();
            if (!ok) {
                // Sin permiso/sensor → fallback: snap a Norte
                map.easeTo({ bearing: 0, pitch: 60, duration: 600 });
            }
        }
    });

    // === Flecha back-to-route: actualiza rotación al moverse el mapa ===
    let offRouteBearing = 0; // último bearing geográfico hacia el punto más cercano
    function updateBackArrow() {
        if (!isOffRoute) return;
        const rotation = offRouteBearing - map.getBearing();
        const el = document.getElementById('back-arrow-wrapper');
        if (el) el.style.transform = `rotate(${rotation}deg)`;
    }

    // === Layer toggle: dark <-> satellite overlay ===
    document.getElementById('btn-layer').addEventListener('click', () => {
        if (layerMode === 'dark') {
            map.setLayoutProperty('sat-layer', 'visibility', 'visible');
            document.getElementById('btn-layer-icon').innerText = '🌙';
            layerMode = 'satellite';
        } else {
            map.setLayoutProperty('sat-layer', 'visibility', 'none');
            document.getElementById('btn-layer-icon').innerText = '🛰️';
            layerMode = 'dark';
        }
    });

    // === Recenter button ===
    const btnRecenter = document.getElementById('btn-recenter');
    btnRecenter.addEventListener('click', () => {
        if (!lastUserPos) return;
        autoFollow = true;
        btnRecenter.classList.add('hidden');
        // Si heading-up está activo, conserva el bearing del dispositivo
        const targetBearing = headingUpMode && deviceHeading !== null ? deviceHeading : 0;
        map.flyTo({ center: lastUserPos, zoom: 16, bearing: targetBearing, pitch: 60, duration: 600 });
    });

    // === Detect user pan/zoom: disable auto-follow ===
    map.on('dragstart', () => {
        if (autoFollow) {
            autoFollow = false;
            btnRecenter.classList.remove('hidden');
        }
    });

    function getIntelIcon(type) {
        const icons = { 'warning': '⚠️', 'photo_epic': '📸', 'water_ok': '💧', 'water_dry': '🏜️', 'surface_mud': '💩', 'surface_snow': '❄️', 'shelter_ok': '⛺', 'shelter_bad': '🏚️' };
        return icons[type] || '📍';
    }

    function startTracking() {
        if (!("geolocation" in navigator)) {
            alert("Tu navegador no soporta GPS.");
            return;
        }
        
        // Request Screen Wake Lock
        try {
            if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').catch(() => console.log("Wake lock refused"));
            }
        } catch(e) {}

        watchId = navigator.geolocation.watchPosition(
            (position) => {
                const lng = position.coords.longitude;
                const lat = position.coords.latitude;
                const accuracy = position.coords.accuracy;
                
                // Update UI
                document.getElementById('gps-accuracy').innerText = `±${accuracy.toFixed(0)}m`;

                // Move marker
                userMarker.setLngLat([lng, lat]);
                lastUserPos = [lng, lat];

                // Center Map (smooth follow) only if user hasn't taken control
                if (autoFollow) {
                    // easeTo solo center: no toca bearing (importante para heading-up)
                    map.easeTo({ center: [lng, lat], duration: 800 });
                }

                // Turf checks
                runSentinelChecks(lng, lat);
            },
            (error) => {
                console.error(error);
                document.getElementById('status-badge').className = "bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1 rounded-full text-[10px] font-black tracking-widest uppercase mb-1 shadow-lg backdrop-blur-sm";
                document.getElementById('status-badge').innerText = "❌ Sin GPS";
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
    }

    function runSentinelChecks(lng, lat) {
        const currentPt = turf.point([lng, lat]);

        // 0. Encontrar segmento más cercano (iteramos toda la MultiLineString)
        let bestDistanceKm = Infinity;
        let bestSegmentIdx = 0;
        let bestSnapped = null;
        subLines.forEach((line, i) => {
            const snapped = turf.nearestPointOnLine(line, currentPt, { units: 'kilometers' });
            const d = snapped.properties.dist; // distancia ortogonal al segmento en km
            if (d < bestDistanceKm) {
                bestDistanceKm = d;
                bestSegmentIdx = i;
                bestSnapped = snapped;
            }
        });

        // Progress: distancia acumulada hasta el inicio del segmento + posición dentro
        const traveledKm = cumulativeLengthsKm[bestSegmentIdx] + (bestSnapped?.properties.location || 0);
        const remainingKm = Math.max(0, totalRouteKm - traveledKm);
        const pct = totalRouteKm > 0 ? Math.min(100, Math.round((traveledKm / totalRouteKm) * 100)) : 0;
        document.getElementById('dist-remaining').innerText = remainingKm.toFixed(1);
        document.getElementById('progress-pct').innerText = pct;

        // 1. Off-Route Check (distancia al segmento más cercano de la ruta completa)
        const distanceMeters = bestDistanceKm * 1000;
        
        const dangerOverlay = document.getElementById('danger-overlay');
        const statusBadge = document.getElementById('status-badge');
        
        if (distanceMeters > OFF_ROUTE_THRESHOLD_METERS) {
            if (!isOffRoute) {
                isOffRoute = true;
                dangerOverlay.classList.remove('opacity-0');
                statusBadge.className = "bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1 rounded-full text-[10px] font-black tracking-widest uppercase mb-1 shadow-lg backdrop-blur-sm";
                statusBadge.innerText = "❌ PELIGRO";
                if(navigator.vibrate) navigator.vibrate([500, 200, 500]); // Aggressive vibrate
            }
            // Actualiza distancia + flecha al punto más cercano
            if (bestSnapped) {
                document.getElementById('off-route-distance').innerText = Math.round(distanceMeters);
                offRouteBearing = turf.bearing(currentPt, bestSnapped); // -180..180, 0 = N geográfico
                updateBackArrow();
            }
        } else {
            if (isOffRoute) {
                isOffRoute = false;
                dangerOverlay.classList.add('opacity-0');
                statusBadge.className = "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-[10px] font-black tracking-widest uppercase mb-1 shadow-lg backdrop-blur-sm";
                statusBadge.innerText = "🟢 En Ruta";
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]); // Friendly vibrate
            }
        }

        // 2. Proximity Intel Alerts
        intelDrops.forEach(drop => {
            if (alertedIntelIds.has(drop.id)) return;
            
            const dropPt = turf.point([drop.lng, drop.lat]);
            const distKm = turf.distance(currentPt, dropPt);
            const distM = Math.round(distKm * 1000);
            
            if (distM < INTEL_ALERT_THRESHOLD_METERS) {
                // Trigger Alert
                alertedIntelIds.add(drop.id);
                if(navigator.vibrate) navigator.vibrate([300, 100, 300]);
                
                const alertDiv = document.getElementById('intel-alert');
                const distSpan = document.getElementById('intel-dist');
                const descSpan = document.getElementById('intel-desc');
                
                alertDiv.classList.remove('hidden');
                distSpan.innerText = distM;
                descSpan.innerHTML = `<span class="font-bold text-amber-500">${getIntelIcon(drop.type)} ${drop.type_display}</span>: ${drop.description}`;
                
                // Hide alert after 15 seconds
                setTimeout(() => {
                    alertDiv.classList.add('hidden');
                    descSpan.innerText = "Vigilando perímetro...";
                }, 15000);
            }
        });
    }

    // Cleanup on exit
    window.addEventListener('beforeunload', () => {
        if(watchId) navigator.geolocation.clearWatch(watchId);
    });
</script>
{% endblock %}
