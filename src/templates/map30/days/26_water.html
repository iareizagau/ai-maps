{% extends parent_template %}
{% load static %}

{% block day_body %}
<div class="map30-wrap"><div id="map" class="map30-canvas"></div></div>
<p class="mt-4 text-xs text-slate-500">
    Los principales ríos vascos acabando en el Cantábrico o en el Ebro. Grosor proporcional a longitud.
    Para producción: BDA (Agencia Vasca del Agua) y SIGPAC.
</p>
{% endblock %}

{% block day_js %}
<script src="{% static 'map30/js/map-core.js' %}"></script>
<script>
(function () {
    "use strict";
    const map = Map30.createMap("map", { basemap: "positron", center: [-2.1, 43.05], zoom: 7.8 });

    const rios = { type:"FeatureCollection", features:[
        {type:"Feature", properties:{name:"Nervión", km:72}, geometry:{type:"LineString", coordinates:[[-3.030,43.000],[-3.000,43.100],[-2.980,43.180],[-2.960,43.230],[-2.935,43.263],[-2.890,43.311],[-2.830,43.350]]}},
        {type:"Feature", properties:{name:"Urumea", km:60}, geometry:{type:"LineString", coordinates:[[-1.820,43.080],[-1.900,43.180],[-1.950,43.250],[-1.981,43.321]]}},
        {type:"Feature", properties:{name:"Oria", km:82}, geometry:{type:"LineString", coordinates:[[-2.150,42.950],[-2.180,43.000],[-2.150,43.070],[-2.080,43.134],[-2.080,43.200],[-2.100,43.260],[-2.168,43.288]]}},
        {type:"Feature", properties:{name:"Deba", km:55}, geometry:{type:"LineString", coordinates:[[-2.410,43.040],[-2.400,43.100],[-2.370,43.160],[-2.350,43.220],[-2.350,43.291]]}},
        {type:"Feature", properties:{name:"Bidasoa", km:69}, geometry:{type:"LineString", coordinates:[[-1.450,43.050],[-1.520,43.130],[-1.600,43.200],[-1.700,43.280],[-1.790,43.336],[-1.800,43.376]]}},
        {type:"Feature", properties:{name:"Zadorra", km:80}, geometry:{type:"LineString", coordinates:[[-2.400,42.900],[-2.500,42.880],[-2.600,42.870],[-2.700,42.850],[-2.900,42.820]]}},
        {type:"Feature", properties:{name:"Ebro", km:910}, geometry:{type:"LineString", coordinates:[[-3.10,42.60],[-2.90,42.55],[-2.50,42.50],[-2.00,42.47],[-1.60,42.42],[-1.20,42.30]]}},
        {type:"Feature", properties:{name:"Arga", km:145}, geometry:{type:"LineString", coordinates:[[-1.320,43.010],[-1.440,42.900],[-1.590,42.850],[-1.644,42.812],[-1.700,42.700],[-1.750,42.600]]}}
    ]};
    const embalses = { type:"FeatureCollection", features:[
        {type:"Feature", properties:{name:"Embalse de Urrunaga", hm3:72}, geometry:{type:"Point", coordinates:[-2.700,42.980]}},
        {type:"Feature", properties:{name:"Embalse de Ullibarri-Ganboa", hm3:146}, geometry:{type:"Point", coordinates:[-2.620,42.920]}},
        {type:"Feature", properties:{name:"Embalse de Añarbe", hm3:44}, geometry:{type:"Point", coordinates:[-1.861,43.212]}},
        {type:"Feature", properties:{name:"Embalse de Yesa", hm3:446}, geometry:{type:"Point", coordinates:[-1.185,42.613]}},
        {type:"Feature", properties:{name:"Embalse de Itoitz", hm3:418}, geometry:{type:"Point", coordinates:[-1.345,42.797]}}
    ]};

    map.on("load", function () {
        map.addSource("r", { type:"geojson", data: rios });
        map.addLayer({
            id:"r-line", type:"line", source:"r",
            paint:{
                "line-color":"#0369a1",
                "line-width":[ "interpolate", ["linear"], ["get","km"], 50, 1.5, 100, 2.5, 400, 4, 900, 6 ],
                "line-opacity":0.9
            },
            layout:{ "line-cap":"round", "line-join":"round" }
        });
        map.addLayer({
            id:"r-lab", type:"symbol", source:"r",
            layout:{ "symbol-placement":"line", "text-field":["get","name"], "text-size":11, "text-font":["Open Sans Italic","Arial Unicode MS Regular"] },
            paint:{ "text-color":"#0c4a6e", "text-halo-color":"#fff", "text-halo-width":1.5 }
        });
        map.addSource("emb", { type:"geojson", data: embalses });
        map.addLayer({
            id:"emb-pt", type:"circle", source:"emb",
            paint:{
                "circle-color":"#0284c7",
                "circle-radius":[ "interpolate", ["linear"], ["get","hm3"], 40, 6, 150, 10, 450, 16 ],
                "circle-stroke-color":"#fff", "circle-stroke-width":1.5, "circle-opacity":0.85
            }
        });
        map.on("click","emb-pt", function(e){
            const p = e.features[0].properties;
            new maplibregl.Popup().setLngLat(e.lngLat)
                .setHTML(`<strong>${p.name}</strong><br/><span style="color:#64748b">${p.hm3} hm³</span>`).addTo(map);
        });
    });
    Map30.addLegend(document.querySelector(".map30-wrap"), `
        <h4>Agua</h4>
        <div class="row"><span class="swatch" style="background:#0369a1"></span><span>Ríos (grosor ∝ longitud)</span></div>
        <div class="row"><span class="swatch" style="background:#0284c7"></span><span>Embalses (área ∝ capacidad)</span></div>
    `);
})();
</script>
{% endblock %}
